[package]
name = "rpf9_explorer"
version = "1.5.1"
edition = "2021"
rust-version = "1.89"

[[bin]]
name = "PercyStar"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
egui-wgpu = "0.31"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
rusty-opus = "1.2"
wgpu = "24"
winit = "0.30"
glam = "0.29"
bytemuck = { version = "1.21", features = ["derive"] }
texture2ddecoder = "0.1.2"
bcpack-rs = { git = "https://github.com/Ahmet-Dedeler/bcpack-rs", rev = "0a887de1edc9c22a425605091f1a8365fdf74dbb", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
